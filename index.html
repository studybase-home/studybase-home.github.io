<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="color-scheme" content="light dark" />
<meta name="theme-color" content="#0f6b5c" />
<!-- ホーム画面に追加してアプリとして使うための設定 -->
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="default" />
<meta name="apple-mobile-web-app-title" content="学習ハブ" />
<link rel="apple-touch-icon" href="icon-180.png" />
<link rel="icon" href="icon-180.png" />
<title>学習ハブ</title>
<style>
  :root {
    --bg: #f4f1ea;
    --surface: #ffffff;
    --surface-2: #ece7db;
    --ink: #1c2420;
    --ink-soft: #5a655f;
    --line: #d8d2c4;
    --accent: #0f6b5c;
    --accent-ink: #ffffff;
    --accent-soft: #dcebe6;
    --shadow: 0 1px 5px rgba(28, 36, 32, 0.08);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #171b19;
      --surface: #222825;
      --surface-2: #2c332f;
      --ink: #eef1ee;
      --ink-soft: #a7b3ab;
      --line: #3a423d;
      --accent: #3aa88f;
      --accent-ink: #0d1512;
      --accent-soft: #24382f;
      --shadow: 0 1px 5px rgba(0, 0, 0, 0.35);
    }
  }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: "Hiragino Kaku Gothic ProN", "Hiragino Sans", "Yu Gothic", "Noto Sans JP", sans-serif;
    line-height: 1.5;
  }
  .wrap { max-width: 640px; margin: 0 auto; padding: 14px 12px 40px; }

  .page-head { margin: 4px 0 12px; }
  .page-head h1 { font-size: 1.35rem; margin: 0; }
  .page-head p { margin: 0; color: var(--ink-soft); font-size: 0.85rem; }

  /* プリントを送るボタン（コンパクト版） */
  .send-print {
    display: flex; align-items: center; gap: 10px;
    background: var(--accent); color: var(--accent-ink);
    border-radius: 12px; padding: 10px 14px; margin: 0 0 18px;
    text-decoration: none; box-shadow: var(--shadow);
    min-height: 52px;
  }
  .send-print .icon { font-size: 1.35rem; line-height: 1; }
  .send-print .label { font-size: 1.05rem; font-weight: 700; }
  .send-print .sub { display: block; font-size: 0.78rem; font-weight: 400; opacity: 0.9; }

  /* 科目グループ */
  .group { margin: 0 0 18px; }
  .group h2 {
    font-size: 0.95rem; margin: 0 0 7px; color: var(--ink-soft);
    border-bottom: 2px solid var(--line); padding-bottom: 4px;
  }
  /* カード：大きく見せるのは単元・番号（label）、種類名は小さく（sub） */
  .card-link {
    display: flex; align-items: center; gap: 10px;
    background: var(--surface); border: 1px solid var(--line);
    border-radius: 12px; padding: 10px 14px; margin: 0 0 7px;
    text-decoration: none; color: var(--ink); box-shadow: var(--shadow);
    min-height: 52px;
  }
  .card-link .icon { font-size: 1.25rem; line-height: 1; flex: 0 0 auto; }
  .card-link .label { font-size: 1.2rem; font-weight: 700; }
  .card-link .sub { display: block; font-size: 0.8rem; font-weight: 400; color: var(--ink-soft); }
  .card-link .arrow { margin-left: auto; color: var(--ink-soft); font-size: 1.15rem; flex: 0 0 auto; }
  .empty-note { color: var(--ink-soft); font-size: 0.88rem; margin: 2px 0 0; }

  .foot { color: var(--ink-soft); font-size: 0.78rem; margin-top: 24px; }
</style>
</head>
<body>
<div class="wrap">

  <header class="page-head">
    <h1>学習ハブ</h1>
    <p>勉強アプリと解説ページの入り口です。</p>
  </header>

  <!-- TODO: プリント送信先リンク
       DropboxのファイルリクエストURLが決まったら、下の href="#" をそのURLに差し替えること。
       （隆之介がプリントの写真を送るためのボタン） -->
  <a class="send-print" href="#" id="send-print-btn">
    <span class="icon">📷</span>
    <span><span class="label">プリントを送る</span>
    <span class="sub">プリントの写真を撮って送れます（準備中）</span></span>
  </a>

  <!-- ===== 科目グループ：英語 ===== -->
  <section class="group">
    <h2>英語</h2>
    <a class="card-link" href="apps/eigo-ittou.html">
      <span class="icon">🔤</span>
      <span><span class="label">NT L9</span>
      <span class="sub">英作文・英単語 一問一答（英文16問・単語29語）</span></span>
      <span class="arrow">›</span>
    </a>
    <!-- 英語のアプリが増えたら、この下に card-link を追加する -->
  </section>

  <!-- ===== 科目グループ：数学 ===== -->
  <section class="group">
    <h2>数学</h2>
    <p class="empty-note">まだありません。これから増えます。</p>
    <!-- 数学のアプリが増えたら、ここに card-link を追加する -->
  </section>

  <!-- ===== 解説ページ ===== -->
  <section class="group">
    <h2>解説ページ</h2>
    <a class="card-link" href="notes/dodecagon-proof.html">
      <span class="icon">📐</span>
      <span><span class="label">正12角形と3つの三角形の証明</span>
      <span class="sub">数学の解説（図を動かして確かめられます）</span></span>
      <span class="arrow">›</span>
    </a>
    <!-- 解説ページが増えたら、この下に card-link を追加する -->
  </section>

  <p class="foot">記録（できた・できない）は、このスマホのブラウザの中だけに保存されます。</p>

</div>
</body>
</html>
