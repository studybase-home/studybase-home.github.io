<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="color-scheme" content="light dark" />
<meta name="theme-color" content="#0f6b5c" />
<!-- ホーム画面に追加してアプリとして使うための設定 -->
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="default" />
<meta name="apple-mobile-web-app-title" content="RYU学習ポータル" />
<link rel="apple-touch-icon" href="icon-180.png" />
<link rel="icon" href="icon-180.png" />
<title>RYU学習ポータル</title>
<style>
  :root {
    --bg: #f4f1ea;
    --surface: #ffffff;
    --surface-2: #ece7db;
    --ink: #1c2420;
    --ink-soft: #5a655f;
    --line: #d8d2c4;
    --accent: #0f6b5c;
    --accent-ink: #ffffff;
    --accent-soft: #dcebe6;
    --shadow: 0 1px 5px rgba(28, 36, 32, 0.08);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #171b19;
      --surface: #222825;
      --surface-2: #2c332f;
      --ink: #eef1ee;
      --ink-soft: #a7b3ab;
      --line: #3a423d;
      --accent: #3aa88f;
      --accent-ink: #0d1512;
      --accent-soft: #24382f;
      --shadow: 0 1px 5px rgba(0, 0, 0, 0.35);
    }
  }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: "Hiragino Kaku Gothic ProN", "Hiragino Sans", "Yu Gothic", "Noto Sans JP", sans-serif;
    line-height: 1.5;
  }
  .wrap { max-width: 640px; margin: 0 auto; padding: 14px 12px 40px; }

  .page-head { margin: 4px 0 10px; }
  .page-head h1 { font-size: 1.35rem; margin: 0; }
  .page-head p { margin: 0; color: var(--ink-soft); font-size: 0.85rem; }

  /* プリントを送る（コンパクトな1行ボタン） */
  .send-note { font-size: 0.82rem; color: var(--ink-soft); margin: 0 2px 5px; }
  .send-row { display: flex; gap: 8px; margin: 0 0 16px; }
  .send-chip {
    flex: 1; display: flex; align-items: center; justify-content: center; gap: 5px;
    background: var(--surface); border: 1.5px solid var(--accent); color: var(--accent);
    border-radius: 999px; padding: 7px 4px; min-height: 44px;
    text-decoration: none; font-weight: 700; font-size: 0.9rem; box-shadow: var(--shadow);
  }
  .send-chip .icon { font-size: 1.05rem; line-height: 1; }

  /* 教科タブ */
  .tabs { display: flex; gap: 8px; margin: 0 0 12px; }
  .tab {
    flex: 1; font-family: inherit; cursor: pointer;
    padding: 9px 10px; min-height: 48px;
    font-size: 1.05rem; font-weight: 700;
    border-radius: 999px; border: 2px solid var(--line);
    background: var(--surface); color: var(--ink-soft);
  }
  .tab.active { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }

  /* カード：大きく見せるのは単元・番号（label）、種類名は小さく（sub）。並びは上が新しい順 */
  .card-link {
    display: flex; align-items: center; gap: 10px;
    background: var(--surface); border: 1px solid var(--line);
    border-radius: 12px; padding: 10px 14px; margin: 0 0 7px;
    text-decoration: none; color: var(--ink); box-shadow: var(--shadow);
    min-height: 52px;
  }
  .card-link .icon { font-size: 1.25rem; line-height: 1; flex: 0 0 auto; }
  .card-link .label { font-size: 1.2rem; font-weight: 700; }
  .card-link .sub { display: block; font-size: 0.8rem; font-weight: 400; color: var(--ink-soft); }
  .card-link .arrow { margin-left: auto; color: var(--ink-soft); font-size: 1.15rem; flex: 0 0 auto; }
  .empty-note { color: var(--ink-soft); font-size: 0.88rem; margin: 2px 0 0; }

  .foot { color: var(--ink-soft); font-size: 0.78rem; margin-top: 24px; }
</style>
</head>
<body>
<div class="wrap">

  <header class="page-head">
    <h1>RYU学習ポータル</h1>
    <p>勉強アプリと解説ページの入り口です。</p>
  </header>

  <!-- プリントを送る：種類ごとにDropboxファイルリクエストへ（コンパクト版） -->
  <p class="send-note">プリントを送る（種類を選んでください）</p>
  <div class="send-row">
    <a class="send-chip" href="https://www.dropbox.com/request/zs3qxr4jho7sdmsmszya"><span class="icon">📷</span>英語</a>
    <a class="send-chip" href="https://www.dropbox.com/request/pyv94loexft184q9eguj"><span class="icon">❓</span>解説がほしい</a>
    <a class="send-chip" href="https://www.dropbox.com/request/j4u46ahkm0bo2dwwyrmn"><span class="icon">📄</span>その他</a>
  </div>

  <!-- 教科タブ -->
  <div class="tabs">
    <button class="tab active" data-tab="english">英語</button>
    <button class="tab" data-tab="math">数学</button>
  </div>

  <!-- ===== 英語（上が新しい順） ===== -->
  <section id="panel-english">
    <!-- 新しいカードは、この下ではなく一番上に追加する -->
    <a class="card-link" href="apps/eigo-fukisoku-list.html">
      <span class="icon">📋</span>
      <span><span class="label">L8-2</span>
      <span class="sub">不規則動詞の過去形 類型別まとめ（58語一覧）</span></span>
      <span class="arrow">›</span>
    </a>
    <a class="card-link" href="apps/eigo-fukisoku.html">
      <span class="icon">✍️</span>
      <span><span class="label">L8-2</span>
      <span class="sub">不規則動詞の過去形 タイピングドリル（58語）</span></span>
      <span class="arrow">›</span>
    </a>
    <a class="card-link" href="apps/eigo-ittou.html">
      <span class="icon">🔤</span>
      <span><span class="label">NT L9</span>
      <span class="sub">英作文・英単語 一問一答（英文16問・単語29語）</span></span>
      <span class="arrow">›</span>
    </a>
  </section>

  <!-- ===== 数学（上が新しい順） ===== -->
  <section id="panel-math" hidden>
    <!-- 新しいカードは、この下ではなく一番上に追加する -->
    <a class="card-link" href="notes/dodecagon-proof.html">
      <span class="icon">📐</span>
      <span><span class="label">正12角形と3つの三角形の証明</span>
      <span class="sub">数学の解説（図を動かして確かめられます）</span></span>
      <span class="arrow">›</span>
    </a>
  </section>

  <p class="foot">記録（できた・できない）は、このスマホのブラウザの中だけに保存されます。</p>

</div>
<script>
  var tabs = document.querySelectorAll(".tab");
  tabs.forEach(function (t) {
    t.addEventListener("click", function () {
      tabs.forEach(function (x) { x.classList.remove("active"); });
      t.classList.add("active");
      document.getElementById("panel-english").hidden = t.getAttribute("data-tab") !== "english";
      document.getElementById("panel-math").hidden = t.getAttribute("data-tab") !== "math";
    });
  });
</script>
</body>
</html>
