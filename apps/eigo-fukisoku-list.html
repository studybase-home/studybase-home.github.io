<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="不規則動詞まとめ">
<title>L8-2 不規則動詞 類型別まとめ｜RYU学習ポータル</title>
<style>
  :root {
    --ink: #1f2430; --ink-soft: #5b6472; --accent: #2563eb; --accent-soft: #e8effd;
    --card: #ffffff; --line: #e3e7ee; --ng: #dc2626;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body {
    margin: 0; font-family: -apple-system, "Hiragino Sans", "Noto Sans JP", sans-serif;
    background: #f4f6fa; color: var(--ink);
    padding: max(14px, env(safe-area-inset-top)) 14px 40px;
  }
  .wrap { max-width: 560px; margin: 0 auto; }
  a.back { color: var(--accent); text-decoration: none; font-size: 0.95rem; font-weight: 600; }
  h1 { font-size: 1.9rem; margin: 8px 0 2px; }
  .subtitle { color: var(--ink-soft); margin: 0 0 14px; font-size: 0.95rem; }
  .card {
    background: var(--card); border: 1px solid var(--line); border-radius: 16px;
    padding: 16px; margin: 12px 0; box-shadow: 0 1px 3px rgba(20,30,60,.05);
  }
  .g-head { display: flex; align-items: center; gap: 10px; margin-bottom: 6px; }
  .g-title { font-size: 1.08rem; font-weight: 800; margin: 0; flex: 1; }
  .g-count { color: var(--ink-soft); font-size: 0.85rem; white-space: nowrap; }
  .play-all {
    display: block; width: 100%; padding: 1rem; margin: 0 0 0.4rem; border: none; border-radius: 14px;
    background: linear-gradient(135deg, #ff9a3d, #ff7a1a); color: #fff; font-size: 1.15rem; font-weight: 800;
    font-family: inherit; cursor: pointer; box-shadow: 0 4px 14px rgba(255, 122, 26, 0.35);
  }
  .play-all-note { text-align: center; color: var(--ink-soft); font-size: 0.82rem; margin: 0 0 1rem; }
  .g-speak {
    border: 2px solid var(--accent); background: #fff; color: var(--accent); border-radius: 999px;
    font-size: 0.85rem; font-weight: 700; padding: 6px 12px; min-height: 40px; white-space: nowrap; cursor: pointer;
  }
  .row {
    display: flex; align-items: center; gap: 10px; padding: 9px 2px;
    border-top: 1px solid var(--line);
  }
  .row:first-of-type { border-top: none; }
  .forms { flex: 1; min-width: 0; }
  .forms .base { font-size: 1.15rem; font-weight: 800; }
  .forms .arrow { color: var(--ink-soft); margin: 0 4px; }
  .forms .past { font-size: 1.15rem; font-weight: 800; color: var(--accent); }
  .forms .jp { display: block; color: var(--ink-soft); font-size: 0.85rem; margin-top: 1px; }
  .forms .nt { display: block; color: var(--ng); font-size: 0.8rem; font-weight: 600; margin-top: 1px; }
  .row-speak {
    border: 1px solid var(--line); background: #fff; border-radius: 999px; font-size: 1rem;
    width: 44px; height: 44px; flex: 0 0 auto; cursor: pointer;
  }
  .drill-link {
    display: block; text-align: center; text-decoration: none; background: var(--accent-soft);
    color: var(--accent); border-radius: 12px; font-size: 1.05rem; font-weight: 700;
    min-height: 52px; line-height: 52px; margin: 10px 0 2px;
  }
  .note { color: var(--ink-soft); font-size: 0.85rem; text-align: center; }
  .playing { text-align: center; font-weight: 700; color: var(--accent); min-height: 1.3em; margin: 4px 0 0; }
</style>
</head>
<body>
<div class="wrap">
  <a class="back" href="../index.html">‹ RYU学習ポータルに戻る</a>
  <h1>L8-2</h1>
  <p class="subtitle">不規則動詞の過去形 類型別まとめ（58語）</p>
  <p class="playing" id="playing"></p>
  <button class="play-all" id="play-all">▶ 全部を流し聞き（58語ぜんぶ）</button>
  <p class="play-all-note">類型に関係なく58語ぜんぶを順番に読み上げます。他のことをしながら聞き流せます。止めたいときはもう一度押してください。</p>
  <div id="groups"></div>
  <p class="note">🔊ボタンで「原形 → 過去形」を聞けます。グループの「全部聞く」で、その類型を続けて聞けます。</p>
</div>
<script>
  var VERBS = [{"jp": "〜である、〜にいる", "b": "be", "p": "was, were", "g": 7, "note": null}, {"jp": "〜になる", "b": "become", "p": "became", "g": 7, "note": null}, {"jp": "〜を始める", "b": "begin", "p": "began", "g": 2, "note": null}, {"jp": "〜を壊す", "b": "break", "p": "broke", "g": 6, "note": null}, {"jp": "〜を持ってくる", "b": "bring", "p": "brought", "g": 3, "note": null}, {"jp": "〜を建てる", "b": "build", "p": "built", "g": 4, "note": null}, {"jp": "〜を買う", "b": "buy", "p": "bought", "g": 3, "note": null}, {"jp": "〜をつかまえる", "b": "catch", "p": "caught", "g": 3, "note": null}, {"jp": "来る", "b": "come", "p": "came", "g": 7, "note": null}, {"jp": "〜を切る", "b": "cut", "p": "cut", "g": 1, "note": null}, {"jp": "〜をする", "b": "do", "p": "did", "g": 7, "note": null}, {"jp": "〜を描く", "b": "draw", "p": "drew", "g": 5, "note": null}, {"jp": "〜を飲む", "b": "drink", "p": "drank", "g": 2, "note": null}, {"jp": "〜を運転する", "b": "drive", "p": "drove", "g": 6, "note": null}, {"jp": "〜を食べる", "b": "eat", "p": "ate", "g": 7, "note": null}, {"jp": "落ちる", "b": "fall", "p": "fell", "g": 7, "note": null}, {"jp": "感じる", "b": "feel", "p": "felt", "g": 4, "note": null}, {"jp": "〜を見つける", "b": "find", "p": "found", "g": 7, "note": null}, {"jp": "飛ぶ", "b": "fly", "p": "flew", "g": 5, "note": null}, {"jp": "〜を忘れる", "b": "forget", "p": "forgot", "g": 6, "note": null}, {"jp": "〜を得る", "b": "get", "p": "got", "g": 6, "note": null}, {"jp": "〜を与える", "b": "give", "p": "gave", "g": 7, "note": null}, {"jp": "行く", "b": "go", "p": "went", "g": 7, "note": null}, {"jp": "成長する", "b": "grow", "p": "grew", "g": 5, "note": null}, {"jp": "〜を持っている", "b": "have", "p": "had", "g": 7, "note": null}, {"jp": "〜が聞こえる", "b": "hear", "p": "heard", "g": 7, "note": null}, {"jp": "〜を打つ", "b": "hit", "p": "hit", "g": 1, "note": null}, {"jp": "〜を手に持つ", "b": "hold", "p": "held", "g": 7, "note": null}, {"jp": "〜を持ち続ける", "b": "keep", "p": "kept", "g": 4, "note": null}, {"jp": "〜を知っている", "b": "know", "p": "knew", "g": 5, "note": null}, {"jp": "出発する", "b": "leave", "p": "left", "g": 4, "note": null}, {"jp": "横になる", "b": "lie", "p": "lay", "g": 7, "note": null}, {"jp": "〜を失う", "b": "lose", "p": "lost", "g": 4, "note": null}, {"jp": "〜を作る", "b": "make", "p": "made", "g": 7, "note": null}, {"jp": "〜を意味する", "b": "mean", "p": "meant", "g": 4, "note": null}, {"jp": "〜と会う", "b": "meet", "p": "met", "g": 4, "note": null}, {"jp": "〜を置く", "b": "put", "p": "put", "g": 1, "note": null}, {"jp": "〜を読む", "b": "read", "p": "read", "sp": "red", "g": 1, "note": "発音は「リード → レッド」。綴りは同じでも読み方が変わります。"}, {"jp": "〜に乗る", "b": "ride", "p": "rode", "g": 6, "note": null}, {"jp": "走る", "b": "run", "p": "ran", "g": 2, "note": null}, {"jp": "〜と言う", "b": "say", "p": "said", "g": 7, "note": null}, {"jp": "〜が見える", "b": "see", "p": "saw", "g": 7, "note": null}, {"jp": "〜を売る", "b": "sell", "p": "sold", "g": 7, "note": null}, {"jp": "〜を送る", "b": "send", "p": "sent", "g": 4, "note": null}, {"jp": "歌う", "b": "sing", "p": "sang", "g": 2, "note": null}, {"jp": "座る", "b": "sit", "p": "sat", "g": 2, "note": null}, {"jp": "〜を話す", "b": "speak", "p": "spoke", "g": 6, "note": null}, {"jp": "〜を過ごす", "b": "spend", "p": "spent", "g": 4, "note": null}, {"jp": "立っている", "b": "stand", "p": "stood", "g": 7, "note": null}, {"jp": "泳ぐ", "b": "swim", "p": "swam", "g": 2, "note": null}, {"jp": "〜を持っていく", "b": "take", "p": "took", "g": 7, "note": null}, {"jp": "〜を教える", "b": "teach", "p": "taught", "g": 3, "note": null}, {"jp": "〜に話す", "b": "tell", "p": "told", "g": 7, "note": null}, {"jp": "〜と思う", "b": "think", "p": "thought", "g": 3, "note": null}, {"jp": "〜を理解する", "b": "understand", "p": "understood", "g": 7, "note": null}, {"jp": "〜を着ている", "b": "wear", "p": "wore", "g": 6, "note": null}, {"jp": "勝つ", "b": "win", "p": "won", "g": 6, "note": null}, {"jp": "〜を書く", "b": "write", "p": "wrote", "g": 6, "note": null}];
  var GROUPS = {
    1: "そのまま型",
    2: "母音が a になる型",
    3: "-ought / -aught 型",
    4: "t で終わる型",
    5: "-ew 型",
    6: "真ん中が o の型",
    7: "その他・まるごと変わる型"
  };
  var EXAMPLES = { 1: "cut → cut", 2: "begin → began", 3: "bring → brought", 4: "build → built", 5: "fly → flew", 6: "break → broke", 7: "go → went" };
  function $(id) { return document.getElementById(id); }
  function enVoice() {
    var voices = window.speechSynthesis ? window.speechSynthesis.getVoices() : [];
    for (var i = 0; i < voices.length; i++) {
      if (voices[i].lang && voices[i].lang.indexOf("en") === 0) { return voices[i]; }
    }
    return null;
  }
  var playing = false;
  function speakOne(v, onend) {
    if (!("speechSynthesis" in window)) { if (onend) { onend(); } return; }
    var u = new SpeechSynthesisUtterance(v.b + ", " + (v.sp || v.p));
    u.lang = "en-US"; u.rate = 0.85;
    var vc = enVoice(); if (vc) { u.voice = vc; }
    if (onend) { u.onend = onend; u.onerror = onend; }
    window.speechSynthesis.speak(u);
  }
  function stopAll() {
    playing = false;
    if ("speechSynthesis" in window) { window.speechSynthesis.cancel(); }
    $("playing").textContent = "";
    var btns = document.querySelectorAll(".g-speak");
  $("play-all").addEventListener("click", speakAll);
    for (var i = 0; i < btns.length; i++) { btns[i].textContent = "🔊 全部聞く"; }
    $("play-all").textContent = "▶ 全部を流し聞き（58語ぜんぶ）";
  }
  function speakGroup(g, btn) {
    if (playing) { stopAll(); return; }
    var items = VERBS.filter(function (v) { return v.g === g; });
    playing = true;
    btn.textContent = "⏹ 止める";
    var idx = 0;
    function step() {
      if (!playing) { return; }
      if (idx >= items.length) { stopAll(); return; }
      var v = items[idx];
      $("playing").textContent = GROUPS[g] + "：" + v.b + " → " + v.p + "（" + (idx + 1) + " / " + items.length + "）";
      speakOne(v, function () { idx++; setTimeout(step, 300); });
    }
    window.speechSynthesis.cancel();
    step();
  }
  function speakAll() {
    if (playing) { stopAll(); return; }
    var btn = $("play-all");
    playing = true;
    btn.textContent = "⏹ 止める";
    var idx = 0;
    function step() {
      if (!playing) { return; }
      if (idx >= VERBS.length) { stopAll(); return; }
      var v = VERBS[idx];
      $("playing").textContent = "全部： " + v.b + " → " + v.p + "（" + (idx + 1) + " / " + VERBS.length + "）";
      speakOne(v, function () { idx++; setTimeout(step, 350); });
    }
    window.speechSynthesis.cancel();
    step();
  }
  function render() {
    var html = "";
    Object.keys(GROUPS).forEach(function (gk) {
      var g = Number(gk);
      var items = VERBS.filter(function (v) { return v.g === g; });
      html += '<div class="card"><div class="g-head"><p class="g-title">' + GROUPS[g] +
        ' <span style="color:var(--ink-soft);font-weight:600;font-size:.9rem;">' + EXAMPLES[g] + "</span></p>" +
        '<span class="g-count">' + items.length + '語</span>' +
        '<button class="g-speak" data-g="' + g + '">🔊 全部聞く</button></div>';
      items.forEach(function (v, i) {
        html += '<div class="row"><div class="forms"><span class="base">' + v.b + '</span>' +
          '<span class="arrow">→</span><span class="past">' + v.p + "</span>" +
          '<span class="jp">' + v.jp + "</span>" +
          (v.note ? '<span class="nt">※ ' + v.note + "</span>" : "") +
          '</div><button class="row-speak" data-i="' + VERBS.indexOf(v) + '">🔊</button></div>';
      });
      html += "</div>";
    });
    $("groups").innerHTML = html;
    var gs = document.querySelectorAll(".g-speak");
    for (var i = 0; i < gs.length; i++) {
      gs[i].addEventListener("click", function () { speakGroup(Number(this.getAttribute("data-g")), this); });
    }
    var rs = document.querySelectorAll(".row-speak");
    for (var j = 0; j < rs.length; j++) {
      rs[j].addEventListener("click", function () {
        stopAll();
        speakOne(VERBS[Number(this.getAttribute("data-i"))]);
      });
    }
  }
  render();
</script>
</body>
</html>
