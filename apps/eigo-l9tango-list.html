<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="L9単語まとめ">
<title>L9 単語リスト 種類別まとめ｜RYU学習ポータル</title>
<style>
  :root {
    --ink: #1f2430; --ink-soft: #5b6472; --accent: #2563eb; --accent-soft: #e8effd;
    --card: #ffffff; --line: #e3e7ee; --ng: #dc2626;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body {
    margin: 0; font-family: -apple-system, "Hiragino Sans", "Noto Sans JP", sans-serif;
    background: #f4f6fa; color: var(--ink);
    padding: max(14px, env(safe-area-inset-top)) 14px 40px;
  }
  .wrap { max-width: 560px; margin: 0 auto; }
  a.back { color: var(--accent); text-decoration: none; font-size: 0.95rem; font-weight: 600; }
  h1 { font-size: 1.9rem; margin: 8px 0 2px; }
  .subtitle { color: var(--ink-soft); margin: 0 0 14px; font-size: 0.95rem; }
  .card {
    background: var(--card); border: 1px solid var(--line); border-radius: 16px;
    padding: 16px; margin: 12px 0; box-shadow: 0 1px 3px rgba(20,30,60,.05);
  }
  .g-head { display: flex; align-items: center; gap: 10px; margin-bottom: 6px; }
  .g-title { font-size: 1.08rem; font-weight: 800; margin: 0; flex: 1; }
  .g-count { color: var(--ink-soft); font-size: 0.85rem; white-space: nowrap; }
  .play-all {
    display: block; width: 100%; padding: 1rem; margin: 0 0 0.4rem; border: none; border-radius: 14px;
    background: linear-gradient(135deg, #ff9a3d, #ff7a1a); color: #fff; font-size: 1.15rem; font-weight: 800;
    font-family: inherit; cursor: pointer; box-shadow: 0 4px 14px rgba(255, 122, 26, 0.35);
  }
  .play-all-note { text-align: center; color: var(--ink-soft); font-size: 0.82rem; margin: 0 0 1rem; }
  .g-speak {
    border: 2px solid var(--accent); background: #fff; color: var(--accent); border-radius: 999px;
    font-size: 0.85rem; font-weight: 700; padding: 6px 12px; min-height: 40px; white-space: nowrap; cursor: pointer;
  }
  .row {
    display: flex; align-items: center; gap: 10px; padding: 9px 2px;
    border-top: 1px solid var(--line);
  }
  .row:first-of-type { border-top: none; }
  .forms { flex: 1; min-width: 0; }
  .forms .base { font-size: 1.15rem; font-weight: 800; }
  .forms .jp { display: block; color: var(--ink-soft); font-size: 0.85rem; margin-top: 1px; }
  .forms .alt { display: block; color: var(--ink-soft); font-size: 0.8rem; margin-top: 1px; }
  .row-speak {
    border: 1px solid var(--line); background: #fff; border-radius: 999px; font-size: 1rem;
    width: 44px; height: 44px; flex: 0 0 auto; cursor: pointer;
  }
  .note { color: var(--ink-soft); font-size: 0.85rem; text-align: center; }
  .playing { text-align: center; font-weight: 700; color: var(--accent); min-height: 1.3em; margin: 4px 0 0; }
</style>
</head>
<body>
<div class="wrap">
  <a class="back" href="../index.html">‹ RYU学習ポータルに戻る</a>
  <h1>L9 単語</h1>
  <p class="subtitle">単語リスト 種類別まとめ（28語）</p>
  <p style="margin:6px 0"><a href="../printables/l9tango-hyo.pdf">📄 印刷用の表：L9単語リスト（PDF）</a></p>
  <p class="playing" id="playing"></p>
  <button class="play-all" id="play-all">▶ 全部を流し聞き（28語ぜんぶ）</button>
  <p class="play-all-note">種類に関係なく28語ぜんぶを順番に読み上げます。他のことをしながら聞き流せます。止めたいときはもう一度押してください。</p>
  <div id="groups"></div>
  <p class="note">🔊ボタンで英語と意味を聞けます。グループの「全部聞く」で、その種類を続けて聞けます。</p>
</div>
<script>
  var VERBS = [
    { jp: "終わる", en: "end", g: 1 },
    { jp: "雪が降る", en: "snow", g: 1 },
    { jp: "キャッチボールをする", en: "play catch", g: 1 },
    { jp: "犬を散歩させる", en: "walk a dog", alt: ["walk the dog", "take a dog for a walk"], g: 1 },
    { jp: "日付", en: "date", g: 2 },
    { jp: "体育館／ジム", en: "gym", g: 2 },
    { jp: "郵便局", en: "post office", g: 2 },
    { jp: "駅", en: "station", g: 2 },
    { jp: "天気", en: "weather", g: 2 },
    { jp: "徒歩5分", en: "five minutes on foot", alt: ["5 minutes on foot", "a five-minute walk", "five minutes' walk"], g: 2 },
    { jp: "曇った", en: "cloudy", g: 3 },
    { jp: "暗い", en: "dark", g: 3 },
    { jp: "空腹な", en: "hungry", g: 3 },
    { jp: "雨降りの", en: "rainy", g: 3 },
    { jp: "病気の／具合が悪い", en: "sick", g: 3 },
    { jp: "病気で寝ている", en: "sick in bed", g: 3 },
    { jp: "雪の降る／雪が積もった", en: "snowy", g: 3 },
    { jp: "のどが渇いた", en: "thirsty", g: 3 },
    { jp: "疲れた", en: "tired", g: 3 },
    { jp: "風の強い", en: "windy", g: 3 },
    { jp: "〜に腹を立てている", en: "angry at", alt: ["angry with"], g: 3 },
    { jp: "遠い", en: "far", g: 4 },
    { jp: "外で／外に", en: "outside", g: 4 },
    { jp: "そのとき", en: "then", alt: ["at that time"], disp: "then ／ at that time", g: 4 },
    { jp: "学校にいる／学校で", en: "at school", g: 4 },
    { jp: "家にいる／家で", en: "at home", g: 4 },
    { jp: "午前10時", en: "10 a.m.", alt: ["10 am", "10:00 a.m."], g: 4 },
    { jp: "午後10時", en: "10 p.m.", alt: ["10 pm", "10:00 p.m."], g: 4 }
  ];
  var GROUPS = {
    1: "①動詞（表現含む）",
    2: "②名詞（表現含む）",
    3: "③形容詞（表現含む）",
    4: "④副詞（表現含む）"
  };
  function $(id) { return document.getElementById(id); }
  function enVoice() {
    var voices = window.speechSynthesis ? window.speechSynthesis.getVoices() : [];
    for (var i = 0; i < voices.length; i++) {
      if (voices[i].lang && voices[i].lang.indexOf("en") === 0) { return voices[i]; }
    }
    return null;
  }
  function jpSpeechText(jp) { return jp.replace(/／/g, "、").replace(/〜/g, ""); }
  var playing = false;
  function speakOne(v, onend) {
    if (!("speechSynthesis" in window)) { if (onend) { onend(); } return; }
    var u = new SpeechSynthesisUtterance(v.en);
    u.lang = "en-US"; u.rate = 0.85;
    var vc = enVoice(); if (vc) { u.voice = vc; }
    u.onend = function () {
      if (!playing && !onend) { return; }
      var uj = new SpeechSynthesisUtterance(jpSpeechText(v.jp));
      uj.lang = "ja-JP"; uj.rate = 1.0;
      if (onend) { uj.onend = onend; uj.onerror = onend; }
      window.speechSynthesis.speak(uj);
    };
    u.onerror = function () { if (onend) { onend(); } };
    window.speechSynthesis.speak(u);
  }
  function stopAll() {
    playing = false;
    if ("speechSynthesis" in window) { window.speechSynthesis.cancel(); }
    $("playing").textContent = "";
    var btns = document.querySelectorAll(".g-speak");
    for (var i = 0; i < btns.length; i++) { btns[i].textContent = "🔊 全部聞く"; }
    $("play-all").textContent = "▶ 全部を流し聞き（28語ぜんぶ）";
  }
  function speakGroup(g, btn) {
    if (playing) { stopAll(); return; }
    var items = VERBS.filter(function (v) { return v.g === g; });
    playing = true;
    btn.textContent = "⏹ 止める";
    var idx = 0;
    function step() {
      if (!playing) { return; }
      if (idx >= items.length) { stopAll(); return; }
      var v = items[idx];
      $("playing").textContent = GROUPS[g] + "：" + (v.disp || v.en) + "（" + v.jp + "）（" + (idx + 1) + " / " + items.length + "）";
      speakOne(v, function () { idx++; setTimeout(step, 300); });
    }
    window.speechSynthesis.cancel();
    step();
  }
  function speakAll() {
    if (playing) { stopAll(); return; }
    var btn = $("play-all");
    playing = true;
    btn.textContent = "⏹ 止める";
    var idx = 0;
    function step() {
      if (!playing) { return; }
      if (idx >= VERBS.length) { stopAll(); return; }
      var v = VERBS[idx];
      $("playing").textContent = "全部： " + (v.disp || v.en) + "（" + v.jp + "）（" + (idx + 1) + " / " + VERBS.length + "）";
      speakOne(v, function () { idx++; setTimeout(step, 350); });
    }
    window.speechSynthesis.cancel();
    step();
  }
  $("play-all").addEventListener("click", speakAll);
  function render() {
    var html = "";
    Object.keys(GROUPS).forEach(function (gk) {
      var g = Number(gk);
      var items = VERBS.filter(function (v) { return v.g === g; });
      html += '<div class="card"><div class="g-head"><p class="g-title">' + GROUPS[g] + "</p>" +
        '<span class="g-count">' + items.length + '語</span>' +
        '<button class="g-speak" data-g="' + g + '">🔊 全部聞く</button></div>';
      items.forEach(function (v) {
        html += '<div class="row"><div class="forms"><span class="base">' + (v.disp || v.en) + "</span>" +
          '<span class="jp">' + v.jp + "</span>" +
          (v.alt ? '<span class="alt">（' + v.alt.join(" ／ ") + " でも正解）</span>" : "") +
          '</div><button class="row-speak" data-i="' + VERBS.indexOf(v) + '">🔊</button></div>';
      });
      html += "</div>";
    });
    $("groups").innerHTML = html;
    var gs = document.querySelectorAll(".g-speak");
    for (var i = 0; i < gs.length; i++) {
      gs[i].addEventListener("click", function () { speakGroup(Number(this.getAttribute("data-g")), this); });
    }
    var rs = document.querySelectorAll(".row-speak");
    for (var j = 0; j < rs.length; j++) {
      rs[j].addEventListener("click", function () {
        stopAll();
        speakOne(VERBS[Number(this.getAttribute("data-i"))]);
      });
    }
  }
  render();
</script>
</body>
</html>
